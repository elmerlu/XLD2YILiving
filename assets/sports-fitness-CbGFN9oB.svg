<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sportsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>

    <!-- Energy Glow Gradient -->
    <linearGradient id="energyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#05121e" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Vitality Background -->
  <rect width="1200" height="900" fill="url(#sportsBg)" />

  <!-- Flowing Energetic Waves -->
  <path d="M-100,520 C250,440 550,620 900,500 C1100,440 1250,540 1350,500 L1350,900 L-100,900 Z" fill="#0f766e" fill-opacity="0.25" />
  <path d="M-100,640 C280,580 620,740 980,620 C1150,560 1250,630 1350,600 L1350,900 L-100,900 Z" fill="#042f2e" fill-opacity="0.5" />

  <!-- Dynamic Energy Track Arcs -->
  <circle cx="600" cy="500" r="320" fill="none" stroke="url(#energyGlow)" stroke-width="3" stroke-dasharray="16,12" opacity="0.6" />
  <circle cx="600" cy="500" r="420" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="24,18" opacity="0.3" />

  <!-- Center Visual Badge: 12F Community Gym & Active Life -->
  <g transform="translate(600, 480)" filter="url(#cardShadow)">
    <!-- Base Disc -->
    <circle cx="0" cy="0" r="180" fill="#0f172a" stroke="#10b981" stroke-width="5" />
    <circle cx="0" cy="0" r="165" fill="#134e4a" stroke="#34d399" stroke-width="2" stroke-dasharray="8,6" opacity="0.8" />

    <!-- Gym Dumbbell Icon Graphic -->
    <g transform="translate(0, -35)">
      <!-- Bar -->
      <rect x="-80" y="-10" width="160" height="20" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
      <!-- Left Weights -->
      <rect x="-105" y="-35" width="25" height="70" rx="8" fill="#f97316" />
      <rect x="-125" y="-45" width="20" height="90" rx="8" fill="#ea580c" />
      <!-- Right Weights -->
      <rect x="80" y="-35" width="25" height="70" rx="8" fill="#f97316" />
      <rect x="105" y="-45" width="20" height="90" rx="8" fill="#ea580c" />
      <!-- Knurling Texture -->
      <line x1="-30" y1="-8" x2="-30" y2="8" stroke="#64748b" stroke-width="2" />
      <line x1="-10" y1="-8" x2="-10" y2="8" stroke="#64748b" stroke-width="2" />
      <line x1="10" y1="-8" x2="10" y2="8" stroke="#64748b" stroke-width="2" />
      <line x1="30" y1="-8" x2="30" y2="8" stroke="#64748b" stroke-width="2" />
    </g>

    <!-- Running / Stretching Silhouette Motif -->
    <g transform="translate(0, 65)">
      <!-- Heartbeat / Active Pulse Line -->
      <path d="M-120,0 L-50,0 L-30,-28 L-10,32 L15,-38 L35,20 L50,0 L120,0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-10" cy="32" r="4" fill="#38bdf8" />
      <circle cx="15" cy="-38" r="5" fill="#fde047" />
    </g>

    <text x="0" y="130" fill="#94a3b8" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="3">D2 12F COMMUNITY GYM</text>
  </g>

  <!-- Header Banner & Typography -->
  <g transform="translate(600, 115)">
    <!-- Pill Badge -->
    <rect x="-190" y="-35" width="380" height="48" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="2" />
    <text x="0" y="-4" fill="#34d399" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="3">社區運動活力・健康共好</text>

    <!-- Main Title -->
    <text x="0" y="55" fill="#ffffff" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="44" font-weight="700" text-anchor="middle" letter-spacing="4" filter="url(#softGlow)">動起來興隆</text>
    
    <!-- Subtitle / Meta -->
    <text x="0" y="100" fill="#bae6fd" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="500" text-anchor="middle" letter-spacing="2">老中青都找得到的運動 × 十二樓協力健身房</text>
  </g>

  <!-- Bottom Metric Highlights -->
  <g transform="translate(600, 810)">
    <rect x="-240" y="-30" width="480" height="56" rx="28" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="2" />
    <text x="0" y="5" fill="#f0fdfa" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="2">
      <tspan fill="#34d399">🏃 樂齡運動 × 下班伸展</tspan>　|　<tspan fill="#38bdf8">🏋️ 12F 住戶里民共享</tspan>
    </text>
  </g>
</svg>

