<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="265" viewBox="0 0 440 265">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- 紙張本體 (Spacious Paper Card Body) -->
  <rect x="14" y="16" width="412" height="234" rx="16" fill="#f5fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- 紙膠帶 (Washi Tape) -->
  <rect x="165" y="7" width="110" height="18" rx="3" fill="#2dd4bf" opacity="0.82" transform="rotate(-1.2 220 16)"/>

  <!-- 小卡頁首：活動 Tag 與日期 -->
  <text x="38" y="56" font-family="'jf-openhuninn', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="13" font-weight="700" fill="#475569">🧰 社宅生活指南</text>
  <text x="396" y="56" text-anchor="end" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#94a3b8">2025.08</text>
  <line x1="36" y1="70" x2="400" y2="70" stroke="#99f6e4" stroke-width="1.2" opacity="0.85"/>

  <!-- 手寫格線裝飾 -->
  <line x1="36" y1="114" x2="298" y2="114" stroke="#99f6e4" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7"/>
    <line x1="36" y1="146" x2="298" y2="146" stroke="#99f6e4" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7"/>
    <line x1="36" y1="178" x2="298" y2="178" stroke="#99f6e4" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- 手寫體實體假文字 -->
  <text x="38" y="106" font-family="'jf-openhuninn', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14.5" font-weight="500" fill="#1e293b" letter-spacing="0.8">剛搬來時水電跟垃圾分類</text>
    <text x="38" y="138" font-family="'jf-openhuninn', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14.5" font-weight="500" fill="#1e293b" letter-spacing="0.8">全靠網站上的急救包指引，</text>
    <text x="38" y="170" font-family="'jf-openhuninn', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14.5" font-weight="500" fill="#1e293b" letter-spacing="0.8">省下好多摸索時間，真是神隊友！</text>

  <!-- 右側手繪主題插圖 (留有充裕呼吸空間) -->
  
      <g transform="translate(322, 72) scale(0.95)">
        <circle cx="45" cy="45" r="42" fill="#ecfeff"/>
        <rect x="22" y="34" width="46" height="34" rx="5" fill="#2dd4bf" stroke="#0f766e" stroke-width="2"/>
        <path d="M36 34 L36 26 Q36 23 45 23 Q54 23 54 26 L54 34" fill="none" stroke="#0f766e" stroke-width="2"/>
        <path d="M45 42 L45 58 M37 50 L53 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </g>
    

  <!-- 住民手寫簽名 -->
  <text x="398" y="224" text-anchor="end" font-family="'jf-openhuninn', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="12.5" font-weight="600" fill="#64748b">—— 剛入住半年的工程師 筆</text>

  <!-- 團隊印章 -->
  <g transform="translate(38, 198) scale(0.88)">
    <circle cx="20" cy="18" r="17" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
    <text x="20" y="22" text-anchor="middle" font-family="'jf-openhuninn', 'Microsoft JhengHei', sans-serif" font-size="9.5" font-weight="bold" fill="#0d9488" opacity="0.8">興隆D2</text>
  </g>
</svg>